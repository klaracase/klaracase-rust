name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # "1.85" is the minimum supported Rust version (rust-version in Cargo.toml).
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.85"
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust ${{ matrix.toolchain }}
        shell: bash
        run: |
          rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component rustfmt,clippy
          rustup default "${{ matrix.toolchain }}"
          rustc --version
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Check on the minimum Rust version
        if: matrix.toolchain != 'stable'
        run: cargo check --locked
      - name: Test, default features
        run: cargo test --locked
      - name: Test, all features
        if: matrix.toolchain == 'stable'
        run: cargo test --locked --all-features
      - name: Test, native-tls
        run: cargo test --locked --no-default-features --features native-tls,tokio

  docs:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Docs, all features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features --locked

  # Builds the docs as docs.rs does, with the docsrs cfg that shows the feature badges. Nightly
  # only, so a nightly change does not fail the run.
  docsrs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: Docs with the docsrs cfg
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo doc --no-deps --all-features --locked

  semver:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # taiki-e/install-action v2.89.0
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b
        with:
          tool: cargo-semver-checks
      - name: Compare with the previous tag
        run: |
          baseline="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "${baseline}" ]; then
            echo "No release tag yet, so there is no baseline. Skipping cargo semver-checks."
            exit 0
          fi
          echo "Baseline: ${baseline}"
          cargo semver-checks check-release --baseline-rev "${baseline}"

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # taiki-e/install-action v2.89.0
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b
        with:
          tool: cargo-deny,cargo-audit
      - name: Licenses, bans and sources
        run: cargo deny check
      - name: Known vulnerabilities
        run: cargo audit

  package:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the package as crates.io would
        run: cargo package --locked

  # The oldest versions the manifest allows must still build. Nightly only, and it may fail
  # without failing the run: it reports a too-low lower bound in Cargo.toml.
  minimal-versions:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: Resolve direct dependencies to their lowest versions
        run: cargo update -Z direct-minimal-versions
      - name: Test
        run: cargo test --all-features
